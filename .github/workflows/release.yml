---
name: Publish collection

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    environment: galaxy
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install ansible-core
        run: python -m pip install "ansible-core==2.21.*"

      - name: Verify the release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          collection_version="$(python -c 'import yaml; print(yaml.safe_load(open("galaxy.yml", encoding="utf-8"))["version"])')"
          release_version="${RELEASE_TAG#v}"
          if [ "$collection_version" != "$release_version" ]; then
            echo "::error::galaxy.yml version $collection_version does not match release tag $RELEASE_TAG"
            exit 1
          fi

      - name: Build the collection
        run: ansible-galaxy collection build --output-path dist

      - name: Publish the collection to Galaxy
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
        run: >-
          ansible-galaxy collection publish
          dist/soupglasses-augeas-*.tar.gz
          --server https://galaxy.ansible.com
          --api-key "$GALAXY_API_KEY"
