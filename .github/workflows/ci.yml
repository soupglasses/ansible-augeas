---
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  sanity:
    name: Sanity (ansible-core ${{ matrix.ansible_core }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - ansible_core: "2.18.*"
            python: "3.11"
          - ansible_core: "2.21.*"
            python: "3.13"
    steps:
      - name: Check out the collection
        uses: actions/checkout@v6
        with:
          path: ansible_collections/soupglasses/augeas

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.python }}"

      - name: Install ansible-core
        run: python -m pip install "ansible-core==${{ matrix.ansible_core }}"

      - name: Run sanity tests
        working-directory: ansible_collections/soupglasses/augeas
        run: ansible-test sanity --venv --python "${{ matrix.python }}" --requirements

  tests:
    name: Tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the collection
        uses: actions/checkout@v6
        with:
          path: ansible_collections/soupglasses/augeas

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Augeas and nginx
        run: sudo apt-get update && sudo apt-get install -y augeas-lenses libaugeas-dev nginx

      - name: Install test dependencies
        run: >-
          python -m pip install
          "ansible-core==2.21.*"
          "python-augeas>=1.2.0"
          "antsibull-changelog==0.35.*"
          mock
          pytest
          pytest-mock
          pytest-xdist

      - name: Verify the changelog
        working-directory: ansible_collections/soupglasses/augeas
        run: |
          antsibull-changelog lint
          antsibull-changelog lint-changelog-yaml changelogs/changelog.yaml
          antsibull-changelog generate
          git diff --exit-code -- CHANGELOG.rst

      - name: Run unit tests
        working-directory: ansible_collections/soupglasses/augeas
        run: ansible-test units --local --python 3.13

      - name: Run integration tests
        working-directory: ansible_collections/soupglasses/augeas
        run: ansible-test integration --local augeas

      - name: Build the Galaxy artifact
        working-directory: ansible_collections/soupglasses/augeas
        run: ansible-galaxy collection build --output-path /tmp/collection

  macos:
    name: Tests (macOS)
    runs-on: macos-15
    env:
      OBJC_DISABLE_INITIALIZE_FORK_SAFETY: "YES"
    steps:
      - name: Check out the collection
        uses: actions/checkout@v6
        with:
          path: ansible_collections/soupglasses/augeas

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Augeas and nginx
        run: brew install augeas libxml2 nginx pkgconf

      - name: Install test dependencies
        run: |
          augeas_prefix="$(brew --prefix augeas)"
          libxml_prefix="$(brew --prefix libxml2)"
          export CFLAGS="-I${augeas_prefix}/include -I${libxml_prefix}/include/libxml2"
          export LDFLAGS="-L${augeas_prefix}/lib -L${libxml_prefix}/lib"
          export PKG_CONFIG_PATH="${libxml_prefix}/lib/pkgconfig"
          python -m pip install \
            "ansible-core==2.21.*" \
            "python-augeas==1.2.0" \
            pytest

      - name: Run unit and lens tests
        working-directory: ansible_collections/soupglasses/augeas
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/unit/plugins/module_utils

      - name: Run integration tests
        working-directory: ansible_collections/soupglasses/augeas
        run: ansible-test integration --local augeas
