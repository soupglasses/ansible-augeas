---
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux:
    name: Linux (ansible-core ${{ matrix.ansible_core }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - ansible_core: "2.18"
            python: "3.11"
          - ansible_core: "2.21"
            python: "3.13"
    env:
      ANSIBLE_CORE_VERSION: "${{ matrix.ansible_core }}"
      PYTHON_VERSION: "${{ matrix.python }}"
    steps:
      - name: Check out the collection
        uses: actions/checkout@v6

      - name: Install Augeas and nginx
        run: sudo apt-get update && sudo apt-get install -y augeas-lenses libaugeas-dev nginx

      - name: Install the tools pinned in mise.toml
        uses: jdx/mise-action@v5

      - name: Run the hk checks
        run: hk check --all

  macos:
    name: macOS
    runs-on: macos-15
    env:
      OBJC_DISABLE_INITIALIZE_FORK_SAFETY: "YES"
    steps:
      - name: Check out the collection
        uses: actions/checkout@v6

      - name: Install Augeas and nginx
        run: |
          brew install augeas libxml2 nginx pkgconf
          augeas_prefix="$(brew --prefix augeas)"
          libxml_prefix="$(brew --prefix libxml2)"
          {
            echo "CFLAGS=-I${augeas_prefix}/include -I${libxml_prefix}/include/libxml2"
            echo "LDFLAGS=-L${augeas_prefix}/lib -L${libxml_prefix}/lib"
            echo "PKG_CONFIG_PATH=${libxml_prefix}/lib/pkgconfig"
          } >> "$GITHUB_ENV"

      - name: Install the tools pinned in mise.toml
        uses: jdx/mise-action@v5

      - name: Run the hk checks
        run: hk check --all
