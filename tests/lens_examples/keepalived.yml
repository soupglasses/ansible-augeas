name: Raise a Keepalived instance priority
lens: Keepalived
file: /etc/keepalived/keepalived.conf
before: |
  vrrp_instance VI_1 {
      state MASTER
      interface eth0
      virtual_router_id 51
      priority 100
  }
task:
  path: 'vrrp_instance[.="VI_1"]'
  config:
    priority: "150"
after: |
  vrrp_instance VI_1 {
      state MASTER
      interface eth0
      virtual_router_id 51
      priority 150
  }
