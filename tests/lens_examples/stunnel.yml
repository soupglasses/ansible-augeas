name: Change a stunnel backend
lens: Stunnel
file: /etc/stunnel/stunnel.conf
before: |
  pid = /run/stunnel.pid
  [https]
  accept = 443
  connect = 127.0.0.1:8443
task:
  config:
    https:
      connect: 127.0.0.1:9443
after: |
  pid = /run/stunnel.pid
  [https]
  accept = 443
  connect = 127.0.0.1:9443
